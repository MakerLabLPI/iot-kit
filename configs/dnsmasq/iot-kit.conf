# iot-kit: DHCP + DNS for the workshop LAN.
# Managed by ~/iot-kit (scripts/phase2-dnsmasq.sh). Edit there, not here.

# --- where to listen -------------------------------------------------------
# LAN only, never the WAN. bind-dynamic (rather than bind-interfaces) lets
# dnsmasq start before eth0 has its address and pick it up when it appears.
interface=eth0
bind-dynamic

# --- DNS -------------------------------------------------------------------
domain-needed
bogus-priv
# /etc/hosts maps the hostname to 127.0.1.1, which must not leak to clients.
no-hosts
domain=lan
# .lan is answered here and never forwarded, so it works with no uplink.
local=/lan/
address=/broker.lan/192.168.50.1
address=/iot-kit.lan/192.168.50.1
# A factory-default UniFi AP looks for its controller at http://unifi:8080/inform
address=/unifi/192.168.50.1
address=/unifi.lan/192.168.50.1
# Upstream servers come from whatever WAN NetworkManager has. Empty when offline.
resolv-file=/run/NetworkManager/no-stub-resolv.conf
cache-size=1000

# --- DHCP ------------------------------------------------------------------
dhcp-authoritative
dhcp-range=192.168.50.100,192.168.50.200,255.255.255.0,12h
dhcp-option=option:router,192.168.50.1
dhcp-option=option:dns-server,192.168.50.1
dhcp-option=option:ntp-server,192.168.50.1
# The AP reservation lives in iot-kit-ap.conf, generated from kit.env (AP_MAC).
# Every lease change is published on the broker (bme/s04/net/dhcp): the LED
# strip flashes when a device joins the WiFi. configs/dnsmasq/dhcp-event.
dhcp-script=/usr/local/sbin/iot-kit-dhcp-event

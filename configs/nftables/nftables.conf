#!/usr/sbin/nft -f
# iot-kit firewall + NAT.
# Managed by ~/iot-kit (scripts/phase3-firewall.sh). Edit there, not here.
#
# Only our own table is replaced, never "flush ruleset": Docker keeps its
# rules in separate tables and they must survive a reload of this file.

define LAN_IF  = "eth0"
define LAN_NET = 192.168.50.0/24
# wlan0 is the Pi's built-in WiFi, wlan1 a USB WiFi adapter
define WAN_IFS = { "eth1", "wlan0", "wlan1" }
# The kit's docker network (scripts/lib.sh: ensure_kit_network): broker,
# web UIs and exercises, with their ports published
define KIT_IF = "br-kit"

table inet iot_kit
delete table inet iot_kit

table inet iot_kit {
    chain input {
        type filter hook input priority filter; policy drop;

        ct state established,related accept
        ct state invalid drop
        iifname "lo" accept

        iifname $LAN_IF jump input_lan
        iifname $WAN_IFS jump input_wan

        # Containers may use the kit's DNS and NTP, nothing else on the host
        iifname $KIT_IF udp dport { 53, 123 } accept
        iifname $KIT_IF tcp dport 53 accept
    }

    chain input_lan {
        tcp dport 22 accept
        # DHCP clients have no address yet, so this comes before the source check
        udp dport 67 accept

        # Everything else only for real LAN clients. This also keeps the
        # services closed while eth0 still sits on another network (before
        # the phase 1 cutover).
        ip saddr != $LAN_NET drop

        # A student lab: every service on the Pi is open to the LAN (MQTT
        # 1883/9001, DNS, NTP, UniFi, Cockpit 9090, the exercises' pages...).
        # Nothing to add here for a new exercise. The WAN side (input_wan)
        # stays SSH only.
        accept
    }

    chain input_wan {
        # SSH is the only service the host network may reach.
        tcp dport 22 accept

        # Not services, but needed to be a client of the host network at all
        udp sport 67 udp dport 68 accept
        ip6 saddr fe80::/10 udp dport 546 accept
        icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } accept

        # Uncomment to make "iot-kit.local" resolvable from the host network
        # udp dport 5353 accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;

        ct state established,related accept
        ct state invalid drop
        iifname $LAN_IF oifname $WAN_IFS ip saddr $LAN_NET accept

        # The LAN reaches every port published by a container (Docker
        # rewrites the destination before this chain), and containers reach
        # the LAN devices (Node-RED polling a board). From the WAN nothing
        # matches and the policy drops it.
        iifname $LAN_IF oifname $KIT_IF ip saddr $LAN_NET accept
        iifname $KIT_IF oifname $LAN_IF accept

        # Containers going out, e.g. to install Node-RED nodes (the UniFi
        # stack uses host networking and does not need this)
        iifname "docker0" oifname $WAN_IFS accept
        iifname "br-*" oifname $WAN_IFS accept
    }

    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;

        ip saddr $LAN_NET oifname $WAN_IFS masquerade
    }
}

# iot-kit: workshop broker, runs in Docker (broker/docker-compose.yml).
# Installed to /etc/iot-kit/mosquitto/ by scripts/phase4-mosquitto.sh.
# Edit it here, not there. The paths below are paths inside the container.
#
# Anonymous access is fine because nftables only lets the LAN reach these ports
# (the kit's own containers reach them too).

listener 1883 0.0.0.0
protocol mqtt

listener 9001 0.0.0.0
protocol websockets

allow_anonymous true

# $SYS/broker/clients/connected refreshed every second (default 10): the LED
# strip (tools/leds) flashes on it when a client connects or drops.
sys_interval 1

# /var/lib/iot-kit/mosquitto on the Pi
persistence true
persistence_location /mosquitto/data/

# /var/log/iot-kit/mosquitto on the Pi, and `docker logs mosquitto`
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
connection_messages true

# UniFi Network Application, started on demand with unifi-up.sh.
#
# The one stack that keeps host networking (the broker, the tools and the
# exercises are on the kit's docker network with published ports): the
# controller discovers the AP by L2 broadcast (UDP 10001) and the database
# only listens on 127.0.0.1. It runs on demand only.
#
# Variables come from /etc/iot-kit/unifi.env (created by phase6-unifi.sh).
name: unifi

services:
  unifi-db:
    image: mongo:7.0
    container_name: unifi-db
    network_mode: host
    command: ["mongod", "--bind_ip", "127.0.0.1", "--port", "27017"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS}
      MONGO_USER: unifi
      MONGO_PASS: ${MONGO_PASS}
      MONGO_DBNAME: unifi
      MONGO_AUTHSOURCE: admin
    volumes:
      - ${UNIFI_DATA}/db:/data/db
      - ./init-mongo.sh:/docker-entrypoint-initdb.d/init-mongo.sh:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--host", "127.0.0.1", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: "no"

  unifi:
    image: lscr.io/linuxserver/unifi-network-application:latest
    container_name: unifi
    network_mode: host
    depends_on:
      unifi-db:
        condition: service_healthy
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ}
      MONGO_USER: unifi
      MONGO_PASS: ${MONGO_PASS}
      MONGO_HOST: 127.0.0.1
      MONGO_PORT: "27017"
      MONGO_DBNAME: unifi
      MONGO_AUTHSOURCE: admin
      MEM_LIMIT: "1024"
      MEM_STARTUP: "1024"
    volumes:
      - ${UNIFI_DATA}/config:/config
    restart: "no"
